<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Laba Rugi</title>
<link rel="stylesheet" href="stylelabarugi.css">
</head>
<body>

<div class="report-container">
  <div class="report-header">
    <h2>PT PRIMA AKUNTINDO</h2>
    <h2>LAPORAN LABA RUGI</h2>
    <p>Per 31 Oktober 2026</p>
  </div>
  
  <table class="report-table">
    <thead>
      <tr>
        <th class="col-kode">Kode</th>
        <th class="col-ket">Keterangan Akun</th>
        <th class="col-nom">Nominal (Rp)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="text-center">4101</td>
        <td class="text-left">Pendapatan Jasa</td>
        <td class="text-right">120.000.000</td>
      </tr>
      <tr>
        <td class="text-center">5101</td>
        <td class="text-left">Beban Gaji Karyawan</td>
        <td class="text-right">30.000.000</td>
      </tr>
      <tr>
        <td class="text-center">5102</td>
        <td class="text-left">Beban Sewa Gedung</td>
        <td class="text-right">10.000.000</td>
      </tr>
      <tr>
        <td class="text-center">5103</td>
        <td class="text-left">Beban Perlengkapan</td>
        <td class="text-right">2.500.000</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <!-- colspan="2" menggabungkan kolom Kode dan Keterangan menjadi satu sel -->
        <td colspan="2" class="text-right bold">TOTAL LABA BERSIH</td>
        <td class="text-right bold">77.500.000</td>
      </tr>
    </tfoot>
  </table>
</div>

</body>
</html>
