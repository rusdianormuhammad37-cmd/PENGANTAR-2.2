<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Keuangan</title>

<link rel="stylesheet" href="styledashboard.css">
</head>
<body>
<div class="dashboard-container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Menu Utama</h2>
    <hr>
    <ul>
      <li>> Dashboard</li>
      <li>> Jurnal</li>
      <li>> Buku Besar</li>
      <li>> Laba Rugi</li>
      <li>> Neraca</li>
    </ul>
    <div class="logout">[Logout]</div>
  </div>

  <!-- Konten Utama -->
  <div class="main-content">
    <h1>DASHBOARD KEUANGAN</h1>
    <p>Selamat datang, Manajer Keuangan!</p>
    
    <div class="card-container">
      <div class="card">
        <span class="card-title">SALDO KAS</span>
        <span class="card-value">Rp 150.000.000</span>
      </div>
      <div class="card">
        <span class="card-title">PIUTANG</span>
        <span class="card-value">Rp 45.500.000</span>
      </div>
    </div>
  </div>
</div>

</body>
</html>
