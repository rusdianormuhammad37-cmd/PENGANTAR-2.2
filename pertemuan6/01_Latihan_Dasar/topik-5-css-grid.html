<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Topik 5: CSS Grid</title>
    <style>
        /* TUGAS 5:
           Ubah .grid-wadah menjadi CSS Grid.
           Buat menjadi 3 kolom berukuran sama besar (menggunakan 1fr).
           Beri jarak antar kotak (gap) sebesar 16px.
        */
        .grid-wadah {
            background-color: #f1f5f9;
            padding: 20px;
            
            /* Tambahkan CSS Grid di sini */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .grid-item { background: #0a825a; color: white; padding: 20px; text-align: center;}
    </style>
</head>
<body>
    <div class="grid-wadah">
        <div class="grid-item">HABIS DUIT</div>
        <div class="grid-item">STRESS</div>
        <div class="grid-item">TUGAS NUMPUK</div>
        <div class="grid-item">DIPUTUSI PACAR</div>
        <div class="grid-item">IPK TURUN</div>
        <div class="grid-item">MAU BUNDIR</div>
    </div>
</body>
</html>
