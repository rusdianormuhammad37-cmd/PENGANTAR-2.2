<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Topik 3: Box Model</title>
    <style>
        /* TUGAS 3:
           Pada class 'kotak':
           1. Tambahkan padding 20px
           2. Tambahkan border 5px solid black
           3. Tambahkan margin 15px
           4. Tambahkan box-sizing: border-box agar ukuran total tetap 200px
        */
        .kotak {
            width: 200px;
            background-color:aquamarine;
            /* Tambahkan kode di bawah ini */
            padding: 20px;
            border: 5px solid rgb(84, 5, 5);
            margin: 15px;
            box-sizing: border-box; /* Best Practice! */

        }
    </style>
</head>
<body>
    <div class="kotak">Ini adalah Box 1</div>
    <div class="kotak">Ini adalah Box 2</div>
</body>
</html>
