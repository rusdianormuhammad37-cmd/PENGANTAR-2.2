<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>05 - Pricing Table - Sebelum</title>
<style>
        /* CSS reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       body {
        display: flex;
        justify-content: center; /* Mengatur posisi card ke tengah secara horizontal */
        align-items: center;     /* Mengatur posisi card ke tengah secara vertikal */
        min-height: 100vh;       /* Memastikan tinggi container memenuhi seluruh layar */
        margin: 0;
        }

        .pricing-container {
            display: flex; /* gunakan Flexbox untuk menyejajarkan paket */
            justify-content: center; /* sejajarkan ke tengah */
            gap: 20px; /* jarak antar paket */
            padding: 50px; /* padding di sekitar container */
        }

        .plan {
            background-color: #ffffff; /* latar belakang putih */
            border: 1px solid #cccccc; /* border abu-abu */
            border-radius: 10px; /* sudut membulat */
            padding: 30px; /* padding dalam kartu */
            text-align: center; /* teks rata tengah */
            width: 250px; /* lebar tetap untuk setiap paket */
            transition: transform 0.3s ease; /* efek transisi saat hover */
        }

        .plan.popular {
            transform: scale(1.05); /* paket populer sedikit lebih besar */
            border-color: #007BFF; /* ubah warna border untuk paket populer */
        }

        .plan h3 {
            margin-bottom: 10px; /* jarak bawah judul paket */
        }

        .plan h2 {
            margin-bottom: 20px; /* jarak bawah harga paket */
        }

        .plan ul {
            list-style-type: none; /* hilangkan bullet pada daftar fitur */
            margin-bottom: 20px; /* jarak bawah daftar fitur */
        }

        .plan ul li {
            margin-bottom: 10px; /* jarak antar fitur */
        }

        .plan button {
            padding: 10px 20px; /* padding dalam tombol */
            background-color: #007BFF; /* warna biru untuk tombol */
            color: #ffffff; /* teks putih pada tombol */
            border-radius: 5px; /* sudut membulat pada tombol */
            border: none; /* hilangkan border default tombol */
            cursor: pointer; /* ubah kursor saat hover tombol */
        }
    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Gunakan CSS Grid atau Flexbox pada ".pricing-container" untuk menyejajarkan 3 paket secara horizontal.
    2. Berikan gaya dasar pada setiap kartu ".plan" (border, padding, border-radius, background putih, text-align center).
    3. Khusus untuk paket tengah (berikan class .popular), ubah ukuran agar sedikit lebih menonjol (transform: scale(1.05) atau padding lebih besar).
    4. Ubah warna border/header pada paket popular untuk membedakannya.
    5. Hilangkan bullet pada daftar fitur (ul) dan berikan jarak.
    -->
    <div class="pricing-container">
        <div class="plan">
            <h3>Basic</h3>
            <h2>Gratis</h2>
            <ul>
                <li>1 Pengguna</li>
                <li>Penyimpanan 1GB</li>
                <li>Dukungan Komunitas</li>
            </ul>
            <button>Pilih Basic</button>
        </div>
        <div class="plan popular">
            <h3>Pro (Populer)</h3>
            <h2>Rp 100.000/bln</h2>
            <ul>
                <li>5 Pengguna</li>
                <li>Penyimpanan 50GB</li>
                <li>Dukungan Prioritas</li>
            </ul>
            <button>Pilih Pro</button>
        </div>
        <div class="plan">
            <h3>Enterprise</h3>
            <h2>Hubungi Kami</h2>
            <ul>
                <li>Pengguna Tak Terbatas</li>
                <li>Penyimpanan Unlimited</li>
                <li>Dukungan 24/7</li>
            </ul>
            <button>Pilih Enterprise</button>
        </div>
    </div>
</body>
</html>
