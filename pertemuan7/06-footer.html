<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>06 - Footer - Sebelum</title>
    <style>
        /* CSS reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Gaya untuk footer */
        footer {
            background-color: #333; /* warna gelap */
            color: #ffffff; /* warna teks putih */
            padding: 50px; /* padding luas */
        }

        .footer-container {
            display: grid; /* CSS Grid */
            grid-template-columns: repeat(4, 1fr); /* 4 kolom sejajar */
            gap: 20px; /* jarak antar kolom */
        }

        .footer-col h3 {
            margin-bottom: 15px; /* jarak bawah untuk judul kolom */
        }

        .footer-col ul {
            list-style: none; /* hilangkan bullet point */
        }

        .footer-col ul li a {
            text-decoration: none; /* hilangkan garis bawah */
            color: #cccccc; /* warna link abu-abu terang */
        }

        .footer-col ul li a:hover {
            color: #ffffff; /* efek hover, ganti warna teks saat hover */
        }

        .footer-bottom {
            text-align: center; /* teks ditengah */
            border-top: 1px solid #555; /* garis atas */
            margin-top: 20px; /* jarak atas dari konten footer */
            padding-top: 10px; /* padding atas untuk teks hak cipta */
        }
    </style>
</head>
<body>
    <!-- 
    INSTRUKSI PENGERJAAN:
    1. Beri background gelap pada <footer>, warna teks putih/terang, dan padding yang cukup luas (misal padding: 50px).
    2. Jadikan class ".footer-container" sebagai CSS Grid dengan "grid-template-columns: repeat(4, 1fr)" agar membentuk 4 kolom sejajar, beri gap antar kolom.
    3. Hilangkan bullet pada <ul>, ubah warna link <a> agar kontras (misal abu-abu terang), dan hilangkan garis bawah.
    4. Tambahkan jarak (margin) pada tiap <h3>.
    5. Bagian hak cipta (copyright) diatur di bawah dengan teks ditengah (text-align: center) dan garis atas (border-top).
    -->
    <footer>
        <div class="footer-container">
            <div class="footer-col">
                <h3>Tentang Kami</h3>
                <p>Kami adalah perusahaan yang menyediakan layanan digital terbaik untuk Anda.</p>
            </div>
            <div class="footer-col">
                <h3>Tautan Cepat</h3>
                <ul>
                    <li><a href="#">Beranda</a></li>
                    <li><a href="#">Tentang</a></li>
                    <li><a href="#">Layanan</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h3>Bantuan</h3>
                <ul>
                    <li><a href="#">FAQ</a></li>
                    <li><a href="#">Cara Pesan</a></li>
                    <li><a href="#">Pengembalian</a></li>
                </ul>
            </div>
            <div class="footer-col">
                <h3>Sosial Media</h3>
                <ul>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Twitter</a></li>
                </ul>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2023 Hak Cipta Dilindungi.</p>
        </div>
    </footer>
</body>
</html>
